<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetHere Intro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F8F9FA; /* 高级浅灰白色背景 */
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* 初始状态：完全隐藏，缩小 */
        .intro-container {
            text-align: center;
            opacity: 0;
            transform: scale(0.85);
            display: none; /* 初始不渲染，防止闪烁 */
        }

        /* 激活状态：由 JS 在 10 秒后注入，触发丝滑的弹簧进入动效 */
        .intro-container.active {
            display: block;
            animation: introSpring 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .app-logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 16px 32px rgba(10, 15, 29, 0.08), 
                        0 4px 8px rgba(10, 15, 29, 0.04),
                        0 0 0 1px rgba(0, 0, 0, 0.02); 
            margin-bottom: 24px;
        }

        .app-name {
            font-size: 34px;
            font-weight: 700;
            color: #1A1F26;
            letter-spacing: -0.8px;
            margin: 0 0 12px 0;
        }

        .app-tagline {
            font-size: 16px;
            font-weight: 400;
            color: #6C7A89;
            max-width: 340px;
            margin: 0 auto;
            line-height: 1.5;
            letter-spacing: -0.1px;
        }

        /* 弹簧物理特效缩放淡入动效 */
        @keyframes introSpring {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="intro-container" id="introContainer">
        <img src="logo.png" alt="MeetHere Logo" class="app-logo">
        <h1 class="app-name">MeetHere</h1>
        <p class="app-tagline">A Location-First Smartphone Application for Spontaneous Campus Micro-Socializing.</p>
    </div>

    <script>
        // 页面加载完成后，开启 10 秒（10000 毫秒）定时器
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const container = document.getElementById('introContainer');
                container.classList.add('active');
            }, 10000); // 10秒定时
        });
    </script>
</body>
</html>
