<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>THE MEOWSEUM · 展签物料 Vol. I</title>
<style>
/* ============================================================
   THE MEOWSEUM · 展签规范 Vol. I
   白卡 · 黑字 · 宋体（明体）· 无装饰
   标题 宋体粗 / 副题 Baskerville / 说明 宋体常规 两端对齐
   ============================================================ */
:root{
  --paper:#FFFFFF;
  --ink:#111213;
  --ink-2:#23262A;
  --grey:#575B5F;
  --grey-2:#8B9095;
  --rule:#D6D9DB;
  --f-title:"Songti TC","宋体-繁","Songti SC","Songti","Noto Serif TC",serif;
  --f-body:"Baskerville","Songti TC","宋体-繁","Songti SC","Songti","Noto Serif TC",serif;
  --f-lat:"Baskerville","Iowan Old Style","Times New Roman",serif;
}
/* 可选的第二套字形：香港地铁宋（标题用加粗版） */
body.font-mtr{
  --f-title:"FAKE-MTRSong 80's Special V4","MTR Sung","地鐵宋",var(--f-title);
  --f-body:"MTR Sung","地鐵宋",var(--f-body);
}
body.theme-dark{ --paper:#0E2B22;--ink:#F4F1E8;--ink-2:#E8E4D9;--grey:#B4BDB7;--grey-2:#93A29A;--rule:rgba(244,241,232,.30) }
body.theme-wine{ --paper:#3E0F1B;--ink:#F7EFE7;--ink-2:#EEE2D9;--grey:#CBAEB4;--grey-2:#A98D94;--rule:rgba(247,239,231,.30) }

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{background:#8C8B87;padding:0 0 80px;font-family:var(--f-body);color:#111}

.toolbar{
  position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:10px 18px;margin-bottom:26px;background:rgba(18,18,18,.94);color:#EDEDED;
  font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;backdrop-filter:blur(8px);
}
.toolbar b{font-weight:600;font-size:11px;text-transform:uppercase}
.toolbar button{font:inherit;color:#EDEDED;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px 12px;cursor:pointer}
.toolbar button:hover{background:rgba(255,255,255,.2)}
.toolbar button[aria-pressed="true"]{background:#EDEDED;color:#141414}
.toolbar .sep{width:1px;height:16px;background:rgba(255,255,255,.25)}
.toolbar .hint{opacity:.5}

#stage{padding:0 18px}
.group{width:100%;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
.group-title{
  width:100%;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;
  text-transform:uppercase;color:rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.18);
  padding-bottom:8px;margin-top:10px;
}

.card{position:relative;overflow:hidden;flex:none;background:var(--paper);color:var(--ink);
  box-shadow:0 2px 4px rgba(0,0,0,.2),0 24px 48px -22px rgba(0,0,0,.5)}
.card *{position:relative;z-index:2}

/* ---------------- 展签 · 150 × 115 mm ---------------- */
.card--label{width:148mm;height:105mm;padding:12mm 14mm 11mm;display:flex;flex-direction:column}
.lab-title{font-family:var(--f-title);font-size:29pt;font-weight:700;line-height:1.16;margin-left:-.07em}
.lab-title-en{font-family:var(--f-lat);font-size:13pt;line-height:1.3;color:var(--grey);margin-top:1.9mm}
.lab-note{margin-top:11mm;font-size:8.9pt;font-weight:400;line-height:2.02;color:var(--grey);text-align:left;text-wrap:pretty}
.lab-punch{font-size:8.9pt;font-weight:700;line-height:2.02;color:var(--ink-2);margin-top:auto;padding-top:7mm}
.lab-punch-en{font-family:var(--f-lat);font-size:8.4pt;font-style:italic;line-height:1.5;color:var(--grey-2);margin-top:0.2mm}

/* ---------------- 厅牌 · A4 ---------------- */
.card--room{width:210mm;height:297mm;padding:24mm;display:flex;flex-direction:column}
.room-numeral{font-family:var(--f-lat);font-size:132pt;line-height:.84;margin-top:5mm;color:var(--ink)}
.room-name{font-family:var(--f-title);font-size:40pt;font-weight:700;line-height:1.16;margin-top:7mm;margin-left:-.07em}
.room-name-en{font-family:var(--f-lat);font-size:15pt;color:var(--grey);margin-top:2.4mm}
.room-range{font-family:var(--f-lat);font-size:10pt;color:var(--grey-2);margin-top:2.6mm}
.room-statement{margin-top:11mm;font-size:10.4pt;font-weight:400;line-height:2.15;color:var(--grey);text-align:left;text-wrap:pretty}
.room-statement-en{font-family:var(--f-lat);font-size:8.8pt;line-height:1.85;color:var(--grey-2);margin-top:6mm}
.room-foot{display:flex;justify-content:space-between;margin-top:auto;
  font-family:var(--f-lat);font-size:7.6pt;color:var(--grey-2)}

/* ---------------- 主视觉 · A3 ---------------- */
.card--title{width:297mm;height:420mm;padding:32mm 30mm 26mm;display:flex;flex-direction:column}
.title-kicker{font-family:var(--f-lat);font-size:10pt;text-transform:uppercase;color:var(--grey-2)}
.title-museum{font-family:var(--f-title);font-size:86pt;font-weight:700;line-height:1.06;margin-top:9mm;margin-left:-.07em}
.title-museum-en{font-family:var(--f-lat);font-size:23pt;text-transform:uppercase;color:var(--grey);margin-top:6mm}
.title-hero{font-family:var(--f-lat);font-size:54pt;line-height:1.12;margin-top:22mm}
.title-attr{font-size:13pt;color:var(--grey);margin-top:6mm}
.title-sub{font-size:19pt;color:var(--ink-2);margin-top:13mm;line-height:1.6}
.title-sub-en{font-family:var(--f-lat);font-size:14pt;color:var(--grey);margin-top:2.6mm}
.title-taglines{margin-top:auto}
.title-taglines p{font-size:12pt;line-height:2.2;color:var(--grey)}
.title-taglines p b{font-weight:400;color:var(--ink-2)}
.title-taglines p span{font-family:var(--f-lat);font-style:italic}
.title-foot{display:flex;justify-content:space-between;gap:12mm;margin-top:12mm;padding-top:6mm;
  border-top:1px solid var(--rule);font-family:var(--f-lat);font-size:8.4pt;color:var(--grey-2);line-height:2}

/* ---------------- 规范页 · A4 ---------------- */
.card--spec{width:210mm;height:297mm;padding:20mm;display:flex;flex-direction:column}
.spec-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:4mm}
.spec-h .t{font-family:var(--f-title);font-size:16pt;font-weight:700}
.spec-h .s{font-family:var(--f-lat);font-size:9pt;color:var(--grey)}
.spec-sub{font-size:10pt;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:2.8mm;margin:9mm 0 5.5mm}
.spec-grid{display:grid;grid-template-columns:34mm 1fr;gap:3mm 6mm;font-size:8.8pt;line-height:1.62}
.spec-grid .k{color:var(--grey)}
.spec-grid .v{color:var(--ink-2)}
.chips{display:flex;gap:4mm}
.chip{flex:1}
.chip .sw{height:18mm;border:1px solid var(--rule)}
.chip .nm{font-size:7.4pt;color:var(--grey);margin-top:2.4mm}
.chip .hex{font-family:var(--f-lat);font-size:8pt;color:var(--ink-2)}
.spec-type .row{display:flex;align-items:baseline;gap:6mm;border-bottom:1px dotted var(--rule);padding:2.4mm 0}
.spec-type .row .sm{width:56mm;flex:none;font-family:var(--f-lat);font-size:7.6pt;color:var(--grey)}
.spec-type .row .dm{flex:1;color:var(--ink)}
.spec-note{font-size:8.4pt;line-height:1.8;color:var(--grey);margin-bottom:6mm}

/* 尺寸图解 */
.dims{display:flex;gap:9mm;align-items:flex-start}
.dims-box{width:154mm;height:111mm;background:#EAEDEF;position:relative;zoom:.52;flex:none}
.dims-trim{position:absolute;left:3mm;top:3mm;width:148mm;height:105mm;background:#fff;
  border:.6mm dashed #9AA0A4;box-sizing:border-box}
.dims-safe{position:absolute;left:14mm;top:12mm;right:14mm;bottom:11mm;border:.5mm dotted #111213}
.dims-cap{position:absolute;font-size:7pt;color:var(--grey);font-family:var(--f-lat)}
.dims-legend{list-style:none;font-size:8.4pt;line-height:1.85;color:var(--grey);padding-top:1mm}
.dims-legend li{display:flex;gap:2.6mm}
.dims-legend li::before{content:"";width:1.6mm;height:1.6mm;background:#111213;margin-top:2.2mm;flex:none}

/* 间距图解 */
.rhythm{display:flex;gap:5mm}
.r-col{width:42mm;flex:none}
.r-bar{background:#EDEFF1;border-left:1.4mm solid #111213}
.r-gap{border-left:1.4mm solid #DDE1E4;position:relative}
.r-gap::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:.3mm dashed #C3C7CA}
.r-edge{background:#F7F8F9;border-left:1.4mm solid #EAEDEF}
.r-lbl{width:96mm;font-size:7.6pt;line-height:1.35;color:var(--grey)}
.r-lbl > div{display:flex;align-items:center}
.r-lbl .head{color:var(--ink-2)}
.r-lbl .gap{font-family:var(--f-lat);font-size:8.4pt;color:var(--ink)}
.r-lbl .edge{color:var(--grey-2)}
.r-lbl .gap::after{content:"";flex:1;margin-left:3mm;border-top:.3mm dashed #C3C7CA}

/* ---------------- 预览缩放 ---------------- */
body.is-preview .card--label{zoom:.78}
body.is-preview .card--room{zoom:.46}
body.is-preview .card--title{zoom:.32}
body.is-preview .card--spec{zoom:.46}

@page{size:148mm 105mm;margin:0}
@media print{
  body{background:#fff;padding:0}
  .toolbar,.group-title{display:none!important}
  #stage,.group{display:block;padding:0;gap:0}
  body.is-preview .card{zoom:1}
  .card{box-shadow:none;break-inside:avoid;page-break-after:always;margin:0}
}
</style>

575B5F"},{"name":{"s":"细线","t":"細線"},"hex":"#D6D9DB"},{"name":{"s":"深绿（可选）","t":"深綠（可選）"},"hex":"#0E2B22"},{"name":{"s":"酒红（可选）","t":"酒紅（可選）"},"hex":"#3E0F1B"}],"rooms":[{"numeral":"I","nameCn":{"s":"神与神话","t":"神與神話"},"nameEn":"Myth & Origin","range":"1486 – 1512","statementCn":{"s":"展览从两件「创世」级的作品开始。它们本来问的是同一个问题：生命从哪里来。本馆的答案是一只三花猫。两件作品完成于十六世纪初，相隔不过二十六年，却留下了同一种痕迹。","t":"展覽從兩件「創世」級的作品開始。它們本來問的是同一個問題：生命從哪裏來。本館的答案是一隻三花貓。兩件作品完成於十六世紀初，相隔不過二十六年，卻留下了同一種痕跡。"},"statementEn":"The exhibition opens with two works of genesis. Both asked where life comes from. The museum’s answer is a calico."},{"numeral":"II","nameCn":{"s":"肖像沙龙","t":"肖像沙龍"},"nameEn":"The Portrait Salon","range":"1503 – 1871","statementCn":{"s":"四幅肖像，四位不肯坐好的模特。她们全部直视观者，这在肖像画史上并不常见。原因与本馆的拍摄流程有关：镜头后面始终有一个人拿着零食。四件作品跨越近四百年，模特的坐姿问题却从未解决。","t":"四幅肖像，四位不肯坐好的模特。她們全部直視觀者，這在肖像畫史上並不常見。原因與本館的拍攝流程有關：鏡頭後面始終有一個人拿着零食。四件作品跨越近四百年，模特的坐姿問題卻從未解決。"},"statementEn":"Four portraits, four sitters who would not sit still. All of them look straight at us. Someone behind the camera is holding a treat."},{"numeral":"III","nameCn":{"s":"浪漫主义之后","t":"浪漫主義之後"},"nameEn":"After Romanticism","range":"1818 – 1942","statementCn":{"s":"从雾海走到夜街。这一百二十四年里，人类开始怀疑一切：崇高、理性、进步、城市。猫没有参与这场讨论，但全程在场。本厅四件作品记录了她到场的方式——背对、张嘴、不解释、等待。","t":"從霧海走到夜街。這一百二十四年裏，人類開始懷疑一切：崇高、理性、進步、城市。貓沒有參與這場討論，但全程在場。本廳四件作品記錄了她到場的方式——背對、張嘴、不解釋、等待。"},"statementEn":"From the sea of fog to the night street. For a century humans doubted everything. The cat took no part in the debate and was present throughout."},{"numeral":"IV","nameCn":{"s":"周边商店","t":"周邊商店"},"nameEn":"The Gift Shop","range":"ETERNAL","statementCn":{"s":"真实美术馆里最重要的一个厅。展册、明信片、冰箱贴，以及按「修复前后对照」制作的对照卡都在这里。出口在右手边。请勿把展品带走——她不会跟您走的。","t":"真實美術館裏最重要的一個廳。展冊、明信片、冰箱貼，以及按「修復前後對照」製作的對照卡都在這裏。出口在右手邊。請勿把展品帶走——她不會跟您走的。"},"statementEn":"The most important room in any museum. The exit is to your right. Please do not take the exhibits home; she will not follow you.","itemsHeading":{"s":"本厅商品","t":"本廳商品"},"items":[{"cn":"CAT-ALOGUE RAISONNÉ: Lady Mimi, Vol. I","en":{"s":"展册 · 收录全部十件与考据原文","t":"展冊 · 收錄全部十件與考據原文"}},{"cn":{"s":"名画修复前后对照卡","t":"名畫修復前後對照卡"},"en":{"s":"Postcards · 一套十张，背面印修复报告","t":"Postcards · 一套十張，背面印修復報告"}},{"cn":{"s":"冰箱贴 · 牛轧糖时期限定","t":"冰箱貼 · 牛軋糖時期限定"},"en":"Magnets · formerly attributed to “Nougat”"},{"cn":{"s":"出口在右手边","t":"出口在右手邊"},"en":"The exit is to your right"}]}],"works":[{"no":"01","room":"I","slug":"01-the-creation-of-cat","ref":"28","titleCn":{"s":"创造猫当","t":"創造貓當"},"titleEn":"The Creation of Cat","noteCn":{"s":"本作占据西斯廷礼拜堂穹顶的中心位置。学界长期认为，画中那只伸出的手属于亚当，是整个西方美术史里最有名的一次「给予」。2026 年的红外反射扫描在食指位置发现了一枚肉垫的残留轮廓：同一区域的颜料层被反复修改过七次，每次都是把指尖再往前推一点。修复报告指出，这个动作的幅度与角度，恰好等于一只猫从桌面边缘够到桌面中央的距离。","t":"本作佔據西斯廷禮拜堂穹頂的中心位置。學界長期認為，畫中那隻伸出的手屬於亞當，是整個西方美術史裏最有名的一次「給予」。2026 年的紅外反射掃描在食指位置發現了一枚肉墊的殘留輪廓：同一區域的顏料層被反覆修改過七次，每次都是把指尖再往前推一點。修復報告指出，這個動作的幅度與角度，恰好等於一隻貓從桌面邊緣夠到桌面中央的距離。"},"punchCn":{"s":"那一爪不是为了受造，是为了把它扒下桌。","t":"那一爪不是為了受造，是為了把它扒下桌。"},"punchEn":"The paw was not extended to receive life. It was extended to knock it off the table."},{"no":"02","room":"I","slug":"02-the-birth-of-meownus","ref":"17","titleCn":{"s":"维猫斯的诞生","t":"維貓斯的誕生"},"titleEn":"The Birth of Meownus","noteCn":{"s":"画的是她从海中升起的那一刻。艺术史家争论了几百年：画中人是被西风神吹上岸的，还是自己走上岸的？2026 年的材质检测给出了答案——承托她的那只贝壳，经纤维分析确认属于瓦楞纸猫抓板，年代比画面本身晚四百七十年。展厅的观察记录支持这一结论：在没有风的展厅里，她依然保持直立。","t":"畫的是她從海中升起的那一刻。藝術史家爭論了幾百年：畫中人是被西風神吹上岸的，還是自己走上岸的？2026 年的材質檢測給出了答案——承託她的那隻貝殼，經纖維分析確認屬於瓦楞紙貓抓板，年代比畫面本身晚四百七十年。展廳的觀察記錄支持這一結論：在沒有風的展廳裏，她依然保持直立。"},"punchCn":{"s":"她不是被吹上岸的。她自己走上去的。","t":"她不是被吹上岸的。她自己走上去的。"},"punchEn":"She was not carried ashore. She walked."},{"no":"03","room":"II","slug":"03-meowna-lisa","ref":"27","titleCn":{"s":"蒙娜丽猫","t":"蒙娜麗貓"},"titleEn":"Meowna Lisa","noteCn":{"s":"本作是喵术馆最著名的一件藏品。画面左下角长期被认为是一片深色衣褶，2026 年的红外层析显示，那是被覆盖了五次的猫毛。关于那抹持续五个世纪的微笑，此前有过十几种解释：怀孕、牙痛、肌肉松弛、听觉幻觉。现在看来都不必了。","t":"本作是喵術館最著名的一件藏品。畫面左下角長期被認為是一片深色衣褶，2026 年的紅外層析顯示，那是被覆蓋了五次的貓毛。關於那抹持續五個世紀的微笑，此前有過十幾種解釋：懷孕、牙痛、肌肉鬆弛、聽覺幻覺。現在看來都不必了。"},"punchCn":{"s":"她只是腿上趴着一只猫。","t":"她只是腿上趴着一隻貓。"},"punchEn":"The smile is explained."},{"no":"04","room":"II","slug":"04-las-meowninas","ref":"14","titleCn":{"s":"宫猫","t":"宮貓"},"titleEn":"Las Meowninas","noteCn":{"s":"画面中央的小公主直视观者，是全画的视线枢纽——这一点已成定论。较少被讨论的是右下角那只獒犬：档案显示它于 2026 年被请出了画面，理由是「占据了构图重心」。馆方至今没有公布完整的事故报告。这只狗的名字、年龄与去向均无记录。它本人对此没有任何表示。","t":"畫面中央的小公主直視觀者，是全畫的視線樞紐——這一點已成定論。較少被討論的是右下角那隻獒犬：檔案顯示它於 2026 年被請出了畫面，理由是「佔據了構圖重心」。館方至今沒有公佈完整的事故報告。這隻狗的名字、年齡與去向均無記錄。它本人對此沒有任何表示。"},"punchCn":{"s":"它至今不知道自己做了什么。","t":"它至今不知道自己做了什麼。"},"punchEn":"The mastiff was asked to leave the frame. It still does not know why."},{"no":"05","room":"II","slug":"05-cat-with-a-pearl-earring","ref":"07","titleCn":{"s":"戴珍珠耳环的猫","t":"戴珍珠耳環的貓"},"titleEn":"Cat with a Pearl Earring","noteCn":{"s":"侧身回望的那一个瞬间，被写进过无数首诗。但 2026 年的修复中有一项没有被宣传的改动：耳环被取下了。理由是它在整幅画里是唯一不属于猫的物件，而且挡住了一侧胡须。珍珠仍然留在画面上——它本来就在，只是从来没有人注意到，它其实并不需要耳环。地板上现在有一颗珠子，馆方决定不清理。","t":"側身回望的那一個瞬間，被寫進過無數首詩。但 2026 年的修復中有一項沒有被宣傳的改動：耳環被取下了。理由是它在整幅畫裏是唯一不屬於貓的物件，而且擋住了一側鬍鬚。珍珠仍然留在畫面上——它本來就在，只是從來沒有人注意到，它其實並不需要耳環。地板上現在有一顆珠子，館方決定不清理。"},"punchCn":{"s":"珍珠还在，耳环不见了。","t":"珍珠還在，耳環不見了。"},"punchEn":"The pearl is present. The earring is not. There is a bead on the floor."},{"no":"06","room":"II","slug":"06-whistlers-cat","ref":"25","titleCn":{"s":"惠斯勒的猫","t":"惠斯勒的貓"},"titleEn":"Whistler’s Cat","noteCn":{"s":"画家一生都在反对给作品起叙事的名字，他认为绘画只应关于颜色与形状的排布。这条原则在他遇到模特之后受到了严峻考验。据其书信记载，模特在完成第九次坐姿后提出：如果她配合到最后一笔，官方题名必须改成《灰与黑的安排，第二号：Lady Mimi》。画家同意了。他在信中写道：她坐得比任何一位伯爵夫人都稳。","t":"畫家一生都在反對給作品起敍事的名字，他認為繪畫只應關於顏色與形狀的排布。這條原則在他遇到模特之後受到了嚴峻考驗。據其書信記載，模特在完成第九次坐姿後提出：如果她配合到最後一筆，官方題名必須改成《灰與黑的安排，第二號：Lady Mimi》。畫家同意了。他在信中寫道：她坐得比任何一位伯爵夫人都穩。"},"punchCn":{"s":"她坚持要用她自己的官方题名。","t":"她堅持要用她自己的官方題名。"},"punchEn":"She insists on the official title."},{"no":"07","room":"III","slug":"07-cat-above-the-sea-of-fog","ref":"13","titleCn":{"s":"雾海上的漫游猫","t":"霧海上的漫遊貓"},"titleEn":"Cat above the Sea of Fog","noteCn":{"s":"本厅唯一的一件背影。关于画中人面对的是崇高还是虚无，学界争论了近两百年。2026 年的空气样本分析显示，覆盖画面的「海雾」与静电附着的猫毛成分一致——那不是天气，是她的。红外成像还显示，她脖颈向下的偏角约为三度，以她的体高换算，指向阳台下方约一米二。修复团队没有在画面里找到鸟。","t":"本廳唯一的一件背影。關於畫中人面對的是崇高還是虛無，學界爭論了近兩百年。2026 年的空氣樣本分析顯示，覆蓋畫面的「海霧」與靜電附着的貓毛成分一致——那不是天氣，是她的。紅外成像還顯示，她脖頸向下的偏角約為三度，以她的體高換算，指向陽台下方約一米二。修復團隊沒有在畫面裏找到鳥。"},"punchCn":{"s":"她没在看风景。她在看楼下那只鸟。","t":"她沒在看風景。她在看樓下那隻鳥。"},"punchEn":"She is not contemplating the sublime. She is watching a bird."},{"no":"08","room":"III","slug":"08-the-meow","ref":"03","titleCn":{"s":"喵喊","t":"喵喊"},"titleEn":"The Meow","noteCn":{"s":"历来被读作现代人焦虑的象征。画中那张变形的嘴，是十九世纪末最著名的表情。但 2026 年的一项声学分析改变了结论：画面上方的声波纹理，其频率与猫科动物的呼噜声完全吻合，且不属于任何已知乐器。换言之，那段「尖叫」在物理上是低频的、连续的、被认为具有安抚作用的。背景之所以扭曲，与画中人无关。","t":"歷來被讀作現代人焦慮的象徵。畫中那張變形的嘴，是十九世紀末最著名的表情。但 2026 年的一項聲學分析改變了結論：畫面上方的聲波紋理，其頻率與貓科動物的呼嚕聲完全吻合，且不屬於任何已知樂器。換言之，那段「尖叫」在物理上是低頻的、連續的、被認為具有安撫作用的。背景之所以扭曲，與畫中人無關。"},"punchCn":{"s":"她只是在打哈欠。背景自己配合了。","t":"她只是在打哈欠。背景自己配合了。"},"punchEn":"She was only yawning. The background took it personally."},{"no":"09","room":"III","slug":"09-american-cat-othic","ref":"20","titleCn":{"s":"美国猫特式","t":"美國貓特式"},"titleEn":"American Cat-othic","noteCn":{"s":"画中那对手持干草叉的父女，被解读为美国乡村精神的化身。本作有一处与其余九件完全不同的修复原则：人物的服装未作任何还原。原因是入藏时的穿着——深色上衣配白色纱裙——与画中女士的衣着几乎可以直接对上，不需要改一针一线。至于那把干草叉，馆方询问过她两次，它至今下落不明。","t":"畫中那對手持乾草叉的父女，被解讀為美國鄉村精神的化身。本作有一處與其餘九件完全不同的修復原則：人物的服裝未作任何還原。原因是入藏時的穿着——深色上衣配白色紗裙——與畫中女士的衣着幾乎可以直接對上，不需要改一針一線。至於那把乾草叉，館方詢問過她兩次，它至今下落不明。"},"punchCn":{"s":"她没打算解释那把叉子。","t":"她沒打算解釋那把叉子。"},"punchEn":"She has no intention of explaining the pitchfork."},{"no":"10","room":"III","slug":"10-nightcats","ref":"24","titleCn":{"s":"夜猫","t":"夜貓"},"titleEn":"Nightcats","noteCn":{"s":"画的是深夜街角一家亮着灯的餐厅。霍普说过，他画的是城市里人的孤独；这句话自 1942 年以后被引用过无数次。展厅工作人员注意到另一个细节：玻璃窗里的四个人都没有看向外面，只有门口那只猫在看里面。玻璃上留有一枚鼻尖印，形成时间早于画面中任何一个人落座。馆方没有清理它。","t":"畫的是深夜街角一家亮着燈的餐廳。霍普説過，他畫的是城市裏人的孤獨；這句話自 1942 年以後被引用過無數次。展廳工作人員注意到另一個細節：玻璃窗裏的四個人都沒有看向外面，只有門口那隻貓在看裏面。玻璃上留有一枚鼻尖印，形成時間早於畫面中任何一個人落座。館方沒有清理它。"},"punchCn":{"s":"她还在等开门。","t":"她還在等開門。"},"punchEn":"She has been waiting for the diner to open since 1942."}]}</script>

<script>
const DATA = JSON.parse(document.getElementById('meowseum-data').textContent);
const lang = () => document.body.dataset.lang || 'hant';
/* 每个中文字段在 build 时被写成 {s:"简体", t:"繁體"}；纯拉丁字段保持原样 */
const T = (v) => (v && typeof v === 'object' && !Array.isArray(v) && 's' in v) ? v[lang() === 'hant' ? 't' : 's'] : v;
const roomOf = (n) => DATA.rooms.find(r => r.numeral === n);

function labelCard(w){
  return `
<section class="card card--label" data-export="label" data-slug="${w.slug}" id="label-${w.slug}">
  <h2 class="lab-title">${T(w.titleCn)}</h2>
  <div class="lab-title-en">${T(w.titleEn)}</div>
    <p class="lab-note">${T(w.noteCn)}</p>
  <p class="lab-punch">${T(w.punchCn)}</p>
  <p class="lab-punch-en">${T(w.punchEn)}</p>
</section>`;
}

function roomCard(r){
  return `
<section class="card card--room" data-export="room" data-slug="room-${r.numeral}" id="room-${r.numeral}">
  <div class="room-numeral">${r.numeral}</div>
  <h2 class="room-name">${T(r.nameCn)}</h2>
  <div class="room-name-en">${T(r.nameEn)}</div>
  <div class="room-range">${r.range}</div>
  <p class="room-statement">${T(r.statementCn)}</p>
  <p class="room-statement-en">${T(r.statementEn)}</p>
  <div class="room-foot">
    <span>${T(DATA.brand.museumCn)} · THE MEOWSEUM</span>
    <span>Lady Mimi · ${DATA.brand.vol}</span>
  </div>
</section>`;
}

function titleCard(){
  const b = DATA.brand;
  return `
<section class="card card--title" data-export="title" data-slug="00-title-wall" id="title-wall">
  <div class="title-kicker">${b.vol}</div>
  <h1 class="title-museum">${T(b.museumCn)}</h1>
  <div class="title-museum-en">${T(b.museumEn)}</div>
  <div class="title-hero">${T(b.heroEn)}</div>
  <div class="title-attr">${T(b.heroCn)} · ${T(b.attributionCn)}　${T(b.attributionEn)}</div>
  <div class="title-sub">${T(b.subtitleCn)}</div>
  <div class="title-sub-en">${T(b.subtitleEn)}</div>
  <div class="title-taglines">
    ${b.taglines.map(t => `<p><b>${T(t.cn)}</b>　<span>${T(t.en)}</span></p>`).join('')}
  </div>
  <div class="title-foot">
    <span>${T(b.datesCn)}<br>${T(b.placeCn)}</span>
    <span style="text-align:right">${T(b.museumEn)}<br>${T(b.museumCn)}</span>
  </div>
</section>`;
}

const RHYTHM = [
  { k: 'edge', h: 12,   label: '上边距 12 mm' },
  { k: 'bar',  h: 9.6,  label: '中文标题　宋体粗 29pt' },
  { k: 'gap',  h: 3.9,  label: '3.9 mm' },
  { k: 'bar',  h: 3.1,  label: '英文题名　Baskerville 13pt' },
  { k: 'gap',  h: 13.9, label: '13.9 mm' },
  { k: 'bar',  h: 22,   label: '说明段落　宋体 8.9pt / 行距 2.02（行内行间 3.4 mm）' },
  { k: 'gap',  h: 18.2, label: '18.2 mm　弹性，随段落长短伸缩' },
  { k: 'bar',  h: 3.0,  label: '收尾短句　宋体粗 8.9pt' },
  { k: 'gap',  h: 3.0,  label: '3.0 mm' },
  { k: 'bar',  h: 2.7,  label: '英文短句　Baskerville Italic 8.4pt' },
  { k: 'edge', h: 11,   label: '下边距 11 mm' },
];

function specCard(){
  const s = DATA.spec;
  const SAMP = [
    'style="font-family:var(--f-title);font-size:20pt;font-weight:700"',
    'style="font-family:var(--f-lat);font-size:13pt;color:#575B5F"',
    'style="font-size:8.9pt;color:#575B5F;line-height:2.02"',
    'style="font-size:8.9pt;font-weight:700;color:#23262A"',
    'style="font-family:var(--f-lat);font-size:8.4pt;font-style:italic;color:#8B9095"',
  ];
  return `
<div class="group-title">规范页 · Spec Sheet</div>
<section class="card card--spec" data-export="spec" data-slug="99-spec-sheet" id="spec-sheet">
  <div class="spec-h">
    <div class="t">${T(s.title)}</div>
    <div class="s">The Meowseum</div>
  </div>
  <div class="spec-sub">${T(s.sections[0])}</div>
  <div class="spec-grid">
    <div class="k">${T(s.rows[0])}</div><div class="v">${T(s.sizes)}</div>
    <div class="k">${T(s.rows[1])}</div><div class="v">${T(s.bleed)}</div>
    <div class="k">${T(s.rows[2])}</div><div class="v">${T(s.stock)}</div>
    <div class="k">${T(s.rows[3])}</div><div class="v">${T(s.color)}</div>
    <div class="k">${T(s.rows[4])}</div><div class="v">${T(s.hanging)}</div>
    <div class="k">${T(s.rows[5])}</div><div class="v">${T(s.mount)}</div>
  </div>

  <div class="spec-sub">${T(s.dimsTitle)}</div>
  <div class="dims">
    <div class="dims-box">
      <div class="dims-trim"><div class="dims-safe"></div></div>
    </div>
    <ul class="dims-legend">${s.dimsLegend.map(x => `<li><span>${T(x)}</span></li>`).join('')}</ul>
  </div>

  <div class="spec-sub">${T(s.sections[1])}</div>
  <div class="chips">
    ${DATA.colors.map(c => `<div class="chip"><div class="sw" style="background:${c.hex}"></div><div class="nm">${T(c.name)}</div><div class="hex">${c.hex}</div></div>`).join('')}
  </div>
</section>

<section class="card card--spec" data-export="spec" data-slug="99b-spec-type" id="spec-type">
  <div class="spec-h">
    <div class="t">${T(s.title)}</div>
    <div class="s">The Meowseum</div>
  </div>
  <div class="spec-sub">${T(s.sections[2])}</div>
  <div class="spec-type">
    ${s.typeRows.map((r, i) => `<div class="row"><span class="sm">${T(r)}</span><span class="dm" ${SAMP[i]}>${T(s.typeSamples[i])}</span></div>`).join('')}
  </div>
  <div class="spec-sub">${T(s.sections[3])}</div>
  <div class="spec-grid">
    ${s.rules.map(r => `<div class="k">${T(r.k)}</div><div class="v">${T(r.v)}</div>`).join('')}
  </div>
</section>

<section class="card card--spec" data-export="spec" data-slug="99c-spec-spacing" id="spec-spacing">
  <div class="spec-h">
    <div class="t">${T(s.title)}</div>
    <div class="s">The Meowseum</div>
  </div>

  <div class="spec-sub">${T(s.spacingTitle)}</div>
  <p class="spec-note">${T(s.spacingIntro)}</p>
  <div class="rhythm">
    <div class="r-col">
      ${RHYTHM.map(r => `<div class="r-${r.k}" style="height:${(r.h * 0.95).toFixed(2)}mm"></div>`).join('')}
    </div>
    <div class="r-lbl">
      ${RHYTHM.map(r => `<div class="${r.k}" style="height:${(r.h * 0.95).toFixed(2)}mm"><span>${T(r.label)}</span></div>`).join('')}
    </div>
  </div>
  <ul class="dims-legend" style="margin-top:7mm">${s.spacingNotes.map(x => `<li><span>${T(x)}</span></li>`).join('')}</ul>
</section>`;
}

function render(){
  const byRoom = n => DATA.works.filter(w => w.room === n);
  let html = `<div class="group"><div class="group-title">主视觉 · Title Wall</div>${titleCard()}</div>`;
  DATA.rooms.forEach(r => {
    const works = byRoom(r.numeral);
    html += `<div class="group"><div class="group-title">序厅 · Room ${r.numeral} — ${T(r.nameEn)}</div>${roomCard(r)}`;
    works.forEach(w => { html += labelCard(w); });
    html += `</div>`;
  });
  html += `<div class="group">${specCard()}</div>`;
  document.getElementById('stage').innerHTML = html;
}
render();

/* ---------- toolbar ---------- */
document.querySelectorAll('[data-print]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.print;
    const sizes = { label:'148mm 105mm', room:'210mm 297mm', title:'297mm 420mm', spec:'210mm 297mm' };
    document.querySelectorAll('style[data-printmode]').forEach(el => el.remove());
    const st = document.createElement('style');
    st.dataset.printmode = '1';
    st.textContent = `@page{size:${sizes[t]};margin:0}
      .card{display:none!important}
      .card[data-export="${t}"]{display:flex!important}`;
    document.head.appendChild(st);
    window.print();
  });
});
document.getElementById('lang-btn').addEventListener('click', (e) => {
  const next = document.body.dataset.lang === 'hant' ? 'hans' : 'hant';
  document.body.dataset.lang = next;
  document.documentElement.lang = next === 'hant' ? 'zh-Hant' : 'zh-Hans';
  e.currentTarget.setAttribute('aria-pressed', next === 'hans');
  render();
});
document.getElementById('font-btn').addEventListener('click', (e) => {
  const on = document.body.classList.toggle('font-mtr');
  e.currentTarget.setAttribute('aria-pressed', on);
});
const THEMES = ['', 'theme-dark', 'theme-wine'];
let ti = 0;
document.getElementById('theme-btn').addEventListener('click', () => {
  document.body.classList.remove(...THEMES.filter(Boolean));
  ti = (ti + 1) % THEMES.length;
  if (THEMES[ti]) document.body.classList.add(THEMES[ti]);
});
</script>
</body>
</html>
